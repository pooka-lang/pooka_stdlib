name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          rebar3-version: "3"
          # gleam-version: "1.19.0"
          # elixir-version: "1"
      - uses: peregrinefinch/setup-pooka@v1
        with:
          pooka-version: "0.1.0"
      - run: pooka deps download
      - run: pooka test
      - run: pooka format --check
